<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="50" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="30" fill="#1f3f2f">项目2第1题 安装布置示意图</text>
  <text x="600" y="85" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="16" fill="#4a4a4a">主回路在左，控制回路在右；上方布置电源与保护元件，中部布置执行元件，下方布置操作元件与端子</text>

  <rect x="60" y="120" width="1080" height="640" rx="12" fill="#f8f8f5" stroke="#6c7a68" stroke-width="2"/>
  <text x="90" y="155" font-family="Microsoft YaHei, SimHei, Arial" font-size="22" fill="#2b2b2b">安装板</text>

  <rect x="100" y="190" width="480" height="500" rx="10" fill="#eef5ef" stroke="#4c7a5a" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="340" y="225" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="24" fill="#2c5a3e">主回路区</text>

  <rect x="620" y="190" width="480" height="500" rx="10" fill="#f5f2eb" stroke="#8a6b46" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="860" y="225" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="24" fill="#7a5634">控制回路区</text>

  <rect x="130" y="250" width="120" height="55" rx="6" fill="#ffffff" stroke="#2f4f3f" stroke-width="2"/>
  <text x="190" y="284" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="24" fill="#2f4f3f">QS</text>

  <rect x="280" y="250" width="160" height="55" rx="6" fill="#ffffff" stroke="#2f4f3f" stroke-width="2"/>
  <text x="360" y="284" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="22" fill="#2f4f3f">FU1（三相）</text>

  <rect x="140" y="360" width="130" height="70" rx="6" fill="#ffffff" stroke="#2f4f3f" stroke-width="2"/>
  <text x="205" y="404" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="24" fill="#2f4f3f">KM1</text>

  <rect x="300" y="360" width="130" height="70" rx="6" fill="#ffffff" stroke="#2f4f3f" stroke-width="2"/>
  <text x="365" y="404" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="24" fill="#2f4f3f">FR1</text>

  <rect x="140" y="470" width="130" height="70" rx="6" fill="#ffffff" stroke="#2f4f3f" stroke-width="2"/>
  <text x="205" y="514" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="24" fill="#2f4f3f">KM2</text>

  <rect x="300" y="470" width="130" height="70" rx="6" fill="#ffffff" stroke="#2f4f3f" stroke-width="2"/>
  <text x="365" y="514" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="24" fill="#2f4f3f">FR2</text>

  <rect x="150" y="590" width="120" height="50" rx="6" fill="#ffffff" stroke="#2f4f3f" stroke-width="2"/>
  <text x="210" y="622" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="22" fill="#2f4f3f">X1 → M1</text>

  <rect x="300" y="590" width="120" height="50" rx="6" fill="#ffffff" stroke="#2f4f3f" stroke-width="2"/>
  <text x="360" y="622" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="22" fill="#2f4f3f">X2 → M2</text>

  <rect x="670" y="250" width="140" height="55" rx="6" fill="#ffffff" stroke="#7a5634" stroke-width="2"/>
  <text x="740" y="284" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="22" fill="#7a5634">FU2</text>

  <rect x="840" y="250" width="150" height="55" rx="6" fill="#ffffff" stroke="#7a5634" stroke-width="2"/>
  <text x="915" y="284" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="22" fill="#7a5634">控制电源母线</text>

  <rect x="700" y="360" width="120" height="70" rx="6" fill="#ffffff" stroke="#7a5634" stroke-width="2"/>
  <text x="760" y="404" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="24" fill="#7a5634">KT1</text>

  <rect x="860" y="360" width="150" height="70" rx="6" fill="#ffffff" stroke="#7a5634" stroke-width="2"/>
  <text x="935" y="392" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="22" fill="#7a5634">辅助触点区</text>
  <text x="935" y="418" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#7a5634">KM1 / KT1</text>

  <rect x="690" y="500" width="140" height="60" rx="6" fill="#ffffff" stroke="#7a5634" stroke-width="2"/>
  <text x="760" y="538" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="22" fill="#7a5634">SB1 停止</text>

  <rect x="860" y="500" width="140" height="60" rx="6" fill="#ffffff" stroke="#7a5634" stroke-width="2"/>
  <text x="930" y="538" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="22" fill="#7a5634">SB2 启动</text>

  <rect x="700" y="600" width="300" height="45" rx="6" fill="#ffffff" stroke="#7a5634" stroke-width="2"/>
  <text x="850" y="629" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="22" fill="#7a5634">控制端子排 X0</text>

  <rect x="505" y="230" width="24" height="430" fill="#d6d6d0" stroke="#999999" stroke-width="1"/>
  <text x="517" y="685" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="14" fill="#666666" transform="rotate(-90 517 685)">线槽</text>

  <rect x="640" y="320" width="420" height="18" fill="#ddd8cf" stroke="#aa9a84" stroke-width="1"/>
  <text x="850" y="315" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="14" fill="#7a5634">上部控制线槽</text>

  <rect x="640" y="455" width="420" height="18" fill="#ddd8cf" stroke="#aa9a84" stroke-width="1"/>
  <text x="850" y="450" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="14" fill="#7a5634">中部控制线槽</text>

  <line x1="190" y1="305" x2="190" y2="360" stroke="#2f4f3f" stroke-width="2"/>
  <line x1="360" y1="305" x2="360" y2="360" stroke="#2f4f3f" stroke-width="2"/>
  <line x1="205" y1="430" x2="205" y2="470" stroke="#2f4f3f" stroke-width="2"/>
  <line x1="365" y1="430" x2="365" y2="470" stroke="#2f4f3f" stroke-width="2"/>
  <line x1="205" y1="540" x2="210" y2="590" stroke="#2f4f3f" stroke-width="2"/>
  <line x1="365" y1="540" x2="360" y2="590" stroke="#2f4f3f" stroke-width="2"/>

  <line x1="740" y1="305" x2="740" y2="360" stroke="#7a5634" stroke-width="2"/>
  <line x1="915" y1="305" x2="915" y2="360" stroke="#7a5634" stroke-width="2"/>
  <line x1="760" y1="430" x2="760" y2="455" stroke="#7a5634" stroke-width="2"/>
  <line x1="930" y1="430" x2="930" y2="455" stroke="#7a5634" stroke-width="2"/>
  <line x1="760" y1="473" x2="760" y2="500" stroke="#7a5634" stroke-width="2"/>
  <line x1="930" y1="473" x2="930" y2="500" stroke="#7a5634" stroke-width="2"/>
  <line x1="760" y1="560" x2="760" y2="600" stroke="#7a5634" stroke-width="2"/>
  <line x1="930" y1="560" x2="930" y2="600" stroke="#7a5634" stroke-width="2"/>

  <text x="340" y="720" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#35543f">动力元件集中布置，便于形成清晰主回路</text>
  <text x="860" y="720" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" fill="#7a5634">控制元件分区布置，便于接线、调试和故障检查</text>
</svg>
